# ~/.tmux.conf — GNU screen-compatible keys (prefix C-a); shared by macOS, Linux, FreeBSD.

# Prefix C-a like screen.
unbind C-b
set -g prefix C-a
bind a send-prefix                 # C-a a: literal C-a
bind C-a last-window               # C-a C-a: toggle last window

# Terminal: 256 colors with terminfo present on every host; truecolor from iTerm2 (tmux >= 3.2).
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"
set -s escape-time 10
set -g focus-events on
set -g history-limit 15000         # screen: defscrollback 15000
set -g mouse on
setw -g mode-keys vi

# screen-style bindings that differ from tmux defaults.
bind Space next-window
bind A command-prompt -I "#W" "rename-window -- '%%'"
bind '"' choose-tree -Zw
bind k confirm-before -p "kill-window #W? (y/n)" kill-window
bind K confirm-before -p "kill-session #S? (y/n)" kill-session
bind S split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind Tab select-pane -t :.+
bind X kill-pane
bind Q kill-pane -a

# screen bindkey ^[[1;3D prev / ^[[1;3C next / ^@ copy: no prefix needed.
bind -n M-Left previous-window
bind -n M-Right next-window
bind -n C-Space copy-mode

# Status line like screen's hardstatus: windows left, host and date/time right.
set -g status-style bg=black,fg=white
set -g status-left "[#S] "
set -g status-right " #H %m/%d %l:%M%p "
